<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>圖片轉存</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div class="mark">↧</div>
    <p class="eyebrow">IMAGE FORMAT SAVER</p>
    <h1>圖片轉存</h1>
    <p id="status" role="status" aria-live="polite">正在讀取圖片…</p>
    <p id="detail" class="muted"></p>
    <img id="preview" alt="轉換後的圖片預覽" hidden>
    <div class="buttons">
      <button id="save" hidden>再次另存新檔</button>
      <button id="close" class="secondary">關閉分頁</button>
    </div>
    <p class="note">在你的瀏覽器內轉換，不上傳至轉檔服務。</p>
  </main>
  <script type="module" src="convert.js"></script>
</body>
</html>
