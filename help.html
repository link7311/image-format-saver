<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><title>圖片轉存使用方式</title><link rel="stylesheet" href="style.css"></head>
<body class="popup"><main>
  <div class="mark">↧</div>
  <p class="eyebrow">IMAGE FORMAT SAVER</p>
  <h1>對圖片按右鍵就好</h1>
  <p>選擇「將圖片轉存為…」，再選擇 <strong>JPG、PNG 或 WEBP</strong>，接著選擇儲存位置。</p>
  <p class="muted">JPG 自動補白底。PNG、WEBP 保留透明度。動態圖片會轉為單張靜態圖。</p>
  <p class="note">轉換於本機完成，不上傳至轉檔服務。</p>
</main></body></html>
